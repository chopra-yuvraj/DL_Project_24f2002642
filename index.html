<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>spotiknow</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @font-face {
    /* JetBrains Mono via Google Fonts, loaded below - keeping the
       @font-face out of the way here so the stack below always has
       a sane fallback even if the network request is blocked. */
  }

  html, body {
    height: 100%;
    background: #0a0a0c;
  }

  body {
    color: #cfcfd4;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Ambient background: two slow, very low-opacity glows drifting past
     each other. Kept subtle and desaturated on purpose - the color
     that matters on this page comes from whichever genre the model
     predicts inside the iframe, not from this shell. */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .ambient span {
    position: absolute;
    width: 46vw;
    height: 46vw;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.05;
  }
  .ambient span:nth-child(1) {
    background: #6ee7d8;
    top: -12%;
    left: -8%;
    animation: sk-drift-a 22s ease-in-out infinite;
  }
  .ambient span:nth-child(2) {
    background: #e79b6e;
    bottom: -16%;
    right: -10%;
    animation: sk-drift-b 26s ease-in-out infinite;
  }
  @keyframes sk-drift-a {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(6vw, 4vh); }
  }
  @keyframes sk-drift-b {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-5vw, -5vh); }
  }

  header {
    position: relative;
    z-index: 1;
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    background: rgba(10, 10, 12, 0.6);
    backdrop-filter: blur(10px);
  }

  header .brand { display: flex; align-items: baseline; gap: 14px; }
  header .logo {
    font-size: 1.05rem;
    font-weight: 700;
    color: #eee;
    letter-spacing: -0.02em;
  }
  header .sub {
    font-size: 0.65rem;
    color: #52525b;
    letter-spacing: 0.1em;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 8px;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #eab308;
    box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.55);
    animation: sk-dot-pulse 1.4s ease-out infinite;
    transition: background 0.4s ease;
  }
  .status-dot.ready {
    background: #34d399;
    animation-duration: 2.2s;
  }
  @keyframes sk-dot-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.5); }
    70%  { box-shadow: 0 0 0 7px rgba(234, 179, 8, 0); }
    100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
  }
  .status-text {
    font-size: 0.65rem;
    color: #52525b;
    letter-spacing: 0.1em;
  }

  .fallback-link {
    margin-left: auto;
    font-size: 0.65rem;
    color: #52525b;
    letter-spacing: 0.06em;
    text-decoration: none;
    white-space: nowrap;
    padding: 6px 10px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .fallback-link:hover {
    color: #e4e4e7;
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.03);
  }

  .frame-wrap {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 0;
    display: flex;
    padding: 16px;
  }

  .frame-shell {
    position: relative;
    flex: 1;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.015);
    backdrop-filter: blur(6px);
    overflow: hidden;
  }

  #loading-msg {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0a0a0c;
    transition: opacity 0.45s ease;
  }
  #loading-msg.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loading-msg .eq {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 22px;
  }
  #loading-msg .eq span {
    width: 4px;
    height: 100%;
    background: #52525b;
    border-radius: 1px;
    animation: sk-eq-bounce 1.1s ease-in-out infinite;
  }
  #loading-msg .eq span:nth-child(1) { animation-delay: 0s; }
  #loading-msg .eq span:nth-child(2) { animation-delay: 0.12s; }
  #loading-msg .eq span:nth-child(3) { animation-delay: 0.24s; }
  #loading-msg .eq span:nth-child(4) { animation-delay: 0.36s; }
  #loading-msg .eq span:nth-child(5) { animation-delay: 0.48s; }
  @keyframes sk-eq-bounce {
    0%, 100% { transform: scaleY(0.2); }
    50%      { transform: scaleY(1); }
  }
  #loading-msg .txt {
    font-size: 0.72rem;
    color: #52525b;
    letter-spacing: 0.1em;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    position: relative;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  iframe.loaded { opacity: 1; }
</style>
</head>
<body>

  <div class="ambient"><span></span><span></span></div>

  <header>
    <div class="brand">
      <span class="logo">spotiknow</span>
      <span class="sub">real-time audio genre classification &middot; edge AI gateway</span>
    </div>
    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">connecting</span>
    </div>
    <a class="fallback-link"
       href="https://yuvraj-chopra-dl-gen-ai-project.hf.space"
       target="_blank" rel="noopener">
      having trouble? open directly &rarr;
    </a>
  </header>

  <div class="frame-wrap">
    <div class="frame-shell">
      <div id="loading-msg">
        <div class="eq"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="txt">booting model&hellip;</div>
      </div>
      <iframe
        id="spotiknow-frame"
        allow="microphone"
        loading="lazy"
      ></iframe>
    </div>
  </div>

  <script>
    // The Gradio Space rebuilds its static assets (hashed filenames under
    // /_app/immutable/... or /assets/...) on every deploy and deletes the
    // old ones. If a visitor's browser has a cached copy of the Space's
    // HTML from a previous deploy, it points at asset files that no
    // longer exist and the app fails to boot (404s + "failed to fetch
    // dynamically imported module" in the console). Appending a fresh
    // query string on every page load stops the browser from reusing
    // that cached HTML, so it always fetches the current build's entry
    // page instead.
    var frame       = document.getElementById('spotiknow-frame');
    var loadingMsg  = document.getElementById('loading-msg');
    var statusDot   = document.getElementById('status-dot');
    var statusText  = document.getElementById('status-text');

    // "load" fires once the iframe's own document has finished loading -
    // this hides the loading message and fades the iframe in once
    // *something* has rendered. Note: this can't detect JS errors
    // happening inside the iframe's own page (that's a different
    // origin, the browser won't let this parent page see into it) -
    // it only confirms the document itself loaded. If the app still
    // looks broken after this fires, the fix isn't on this page; open
    // the fallback link above and check that page's own console.
    frame.addEventListener('load', function () {
      loadingMsg.classList.add('hidden');
      frame.classList.add('loaded');
      statusDot.classList.add('ready');
      statusText.textContent = 'model ready';
    });

    frame.src = 'https://yuvraj-chopra-dl-gen-ai-project.hf.space?cachebust=' + Date.now();
  </script>
</body>
</html>
